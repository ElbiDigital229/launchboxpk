<body style="font-family:-apple-system,system-ui,sans-serif;padding:40px">Booking moved to <a href="/contact">our contact page</a>.<script>
(function () {
  if (window.__lbAnalyticsBound) return; window.__lbAnalyticsBound = true;
  var FB_MAP = { whatsapp_click: { ev: 'Lead', label: 'WhatsApp' }, book_visit_click: { ev: 'Lead', label: 'Book a visit' },
                 mailto_click: { ev: 'Contact', label: 'Email' }, phone_click: { ev: 'Contact', label: 'Phone' } };
  function track(name, params) {
    window.gtag('event', name, params || {});
    var fb = FB_MAP[name];
    if (fb && typeof window.fbq === 'function') {
      window.fbq('track', fb.ev, { content_name: fb.label, content_category: (params && params.page_path) || location.pathname },
        { eventID: 'lb-' + Date.now() + '-' + Math.random().toString(36).slice(2) });
    }
  }
  window.lbTrack = track;
  function classify(a) {
    var href = a.getAttribute('href') || '', text = (a.textContent || '').trim().slice(0, 80);
    if (href.indexOf('tel:') === 0) return { name: 'phone_click', params: { link_url: href, link_text: text } };
    if (href.indexOf('mailto:') === 0) return { name: 'mailto_click', params: { link_url: href, link_text: text } };
    if (/wa\.me|api\.whatsapp\.com|whatsapp\.com\/send/i.test(href)) return { name: 'whatsapp_click', params: { link_url: href, link_text: text, page_path: location.pathname } };
    if (/(^|\/)book-visit(\/|\?|#|$)/i.test(href)) return { name: 'book_visit_click', params: { link_url: href, link_text: text, page_path: location.pathname } };
    return null;
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null; if (!a) return;
    var ev = classify(a); if (ev) track(ev.name, ev.params);
  }, true);
})();
