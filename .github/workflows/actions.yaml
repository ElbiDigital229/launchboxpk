name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # The site is pre-built static HTML in /site (source + builders live in Drive:
      # Work/Launchbox Coworking/Launchbox Website, exported with site/export_live.py).
      - name: Sync images (cache 30 days)
        run: aws s3 sync site/ s3://launchboxpk.com --exclude "*" --include "*.webp" --include "*.jpg" --include "*.png" --include "*.ico" --include "*.svg" --cache-control "public, max-age=2592000"

      - name: Sync pages and everything else (short cache)
        run: aws s3 sync site/ s3://launchboxpk.com --delete --exclude "job-portal/jobs.json" --exclude "*.webp" --exclude "*.jpg" --exclude "*.png" --exclude "*.ico" --exclude "*.svg" --cache-control "public, max-age=300, must-revalidate"

      - name: Update CloudFront URL-rewrite function
        run: |
          FUNCTION_NAME="launchboxpk-url-rewrite"
          ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FUNCTION_NAME" \
            --function-config '{"Comment":"301s for removed pages + clean URLs to <path>/index.html","Runtime":"cloudfront-js-2.0"}' \
            --function-code fileb://cloudfront-function.js \
            --if-match "$ETAG"
          ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront publish-function \
            --name "$FUNCTION_NAME" \
            --if-match "$ETAG"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E4FC18X0B6JRG --paths "/*"
