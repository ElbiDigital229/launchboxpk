name: Deploy to S3

on:
  push:
    branches:
      - main
  # Also re-deploy after Fetch jobs commits a refreshed jobs.json.
  # Pushes from the default GITHUB_TOKEN don't fire push triggers (anti-loop),
  # so we chain explicitly here.
  workflow_run:
    workflows: ['Fetch jobs']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # When triggered by Fetch jobs, only deploy if that run actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync hashed assets (long cache, immutable)
        run: aws s3 sync dist/_astro s3://launchboxpk.com/_astro --cache-control "public, max-age=31536000, immutable"

      - name: Sync everything else (short cache)
        run: aws s3 sync dist/ s3://launchboxpk.com --delete --exclude "_astro/*" --cache-control "public, max-age=300, must-revalidate"

      - name: Update CloudFront URL-rewrite function
        run: |
          FUNCTION_NAME="launchboxpk-url-rewrite"
          ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FUNCTION_NAME" \
            --function-config '{"Comment":"Rewrite clean URLs to <path>/index.html for Astro dist","Runtime":"cloudfront-js-2.0"}' \
            --function-code fileb://cloudfront-function.js \
            --if-match "$ETAG"
          ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront publish-function \
            --name "$FUNCTION_NAME" \
            --if-match "$ETAG"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E4FC18X0B6JRG --paths "/*"
